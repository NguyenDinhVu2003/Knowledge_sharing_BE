
spring.application.name=knowledge-sharing-backend

# Server Configuration
server.port=${PORT:8090}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/knowledge_sharing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useUnicode=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# File Upload Configuration

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Gemini AI Configuration (Free tier)
gemini.api.key=${GEMINI_API_KEY:AIzaSyDjmAFjCPIBsid3AFN1A9cLmlqSGX-5CZs}

# Summary Generation Configuration
gemini.summary.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.summary.model=gemini-2.5-flash
gemini.summary.max.tokens=500
gemini.summary.temperature=0.7
gemini.summary.timeout=30

# Embedding Generation Configuration
gemini.embedding.api.url=https://generativelanguage.googleapis.com/v1
gemini.embedding.model=text-embedding-004
gemini.embedding.timeout=30

# Rate Limiting
api.rate.limit.summary.requests-per-minute=10
api.rate.limit.embedding.requests-per-minute=1000
api.rate.limit.embedding.requests-per-day=50000

# JWT Configuration
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.company.knowledge_sharing_backend=DEBUG

# ===========================
# SPRINGDOC / SWAGGER CONFIGURATION
# ===========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

# ===========================
# REDIS CONFIGURATION
# ===========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Cache configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# ===========================
# JPA PERFORMANCE OPTIMIZATION
# ===========================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Query optimization
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Second-level cache (optional - if using Hibernate cache)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# ===========================
# COMPRESSION CONFIGURATION
# ===========================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# ===========================
# DATABASE CONNECTION POOL (HikariCP)
# ===========================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=KnowledgeSharingHikariCP

# ===========================
# ACTUATOR / MONITORING
# ===========================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# ===========================
# AWS S3 FILE STORAGE CONFIGURATION
# ===========================
# AWS S3 Credentials (use environment variables in production)
# IMPORTANT: Set these via Railway environment variables, NOT here!
aws.s3.access-key=${AWS_S3_ACCESS_KEY:YOUR_ACCESS_KEY_HERE}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:YOUR_SECRET_KEY_HERE}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:your-bucket-name}

# Presigned URL expiration time in minutes (default: 60 = 1 hour)
aws.s3.presigned-url-expiration-minutes=60

